<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bun-top { fill: #ffaa00; }
    .seed { fill: #fff3d6; }
    .lettuce { fill: #2e7d32; }
    .patty { fill: #6b2b12; }
    .bun-bottom { fill: #f29a00; }
    /* Brighter fillings so they stay visible on dark tab bars */
    @media (prefers-color-scheme: dark) {
      .lettuce { fill: #5cbf60; }
      .patty { fill: #b25a2e; }
    }
  </style>
  <!-- Top bun -->
  <path class="bun-top" d="M6 27C6 14 18 6 32 6s26 8 26 21z" />
  <!-- Sesame seeds -->
  <g class="seed">
    <ellipse cx="22" cy="15" rx="2.5" ry="1.5" transform="rotate(-20 22 15)" />
    <ellipse cx="32" cy="11" rx="2.5" ry="1.5" />
    <ellipse cx="42" cy="15" rx="2.5" ry="1.5" transform="rotate(20 42 15)" />
  </g>
  <!-- Lettuce -->
  <path class="lettuce" d="M4 29h56v3c-4 3-7 3-9.3 0-2.4 3-6.9 3-9.3 0-2.4 3-6.9 3-9.4 0-2.4 3-6.9 3-9.3 0-2.4 3-6.9 3-9.3 0C11 35 8 35 4 32z" />
  <!-- Patty -->
  <rect class="patty" x="5" y="36" width="54" height="9" rx="4.5" />
  <!-- Bottom bun -->
  <path class="bun-bottom" d="M6 47h52v4a7 7 0 0 1-7 7H13a7 7 0 0 1-7-7z" />
</svg>
